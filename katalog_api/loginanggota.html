<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login Anggota | E-Perpus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-5">
            <div class="card shadow-lg">
                <div class="card-header text-center bg-success text-white py-4">
                    <i class="fas fa-user-circle fa-3x mb-2"></i>
                    <h4 class="mb-0">Login Anggota</h4>
                    <small>E-Perpus Subang</small>
                </div>
                <div class="card-body p-4">

                    <!-- Alert Container -->
                    <div id="alertContainer"></div>

                    <!-- Form -->
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                <input type="text" class="form-control" id="username" required autofocus>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100 btn-lg" id="loginBtn">
                            <i class="fas fa-sign-in-alt"></i> Login
                        </button>
                    </form>

                    <hr>

                    <div class="text-center">
                        <p class="mb-2">
                            Belum punya akun? <a href="anggotaregister.html" class="fw-bold">Daftar Sekarang</a>
                        </p>
                        <a href="katalogindex.html" class="btn btn-sm btn-outline-secondary">
                            <i class="fas fa-arrow-left"></i> Kembali ke Katalog
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>
// Configuration
const API_BASE = window.location.origin + '/public/api';

// Show Alert
function showAlert(message, type = 'danger') {
    const alertContainer = document.getElementById('alertContainer');
    alertContainer.innerHTML = `
        <div class="alert alert-${type} alert-dismissible fade show">
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    `;
}

// Handle Login Form
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const loginBtn = document.getElementById('loginBtn');
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    // Disable button
    loginBtn.disabled = true;
    loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Memproses...';

    try {
        const response = await fetch(`${API_BASE}/apiLoginAnggota.php`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (data.success) {
            // Save token to localStorage
            localStorage.setItem('anggota_token', data.data.token);
            localStorage.setItem('anggota_data', JSON.stringify(data.data));

            showAlert('Login berhasil! Mengalihkan...', 'success');
            
            // Redirect to dashboard
            setTimeout(() => {
                window.location.href = 'anggotaDashboard.html';
            }, 1000);
        } else {
            showAlert(data.error || 'Login gagal. Coba lagi.');
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
        }
    } catch (error) {
        console.error('Error:', error);
        showAlert('Terjadi kesalahan. Coba lagi.');
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
    }
});

// Check if already logged in
document.addEventListener('DOMContentLoaded', function() {
    const token = localStorage.getItem('anggota_token');
    if (token) {
        window.location.href = 'anggotaDashboard.html';
    }
});
</script>

</body>
</html>
